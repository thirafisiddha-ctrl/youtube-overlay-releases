name: Update Download Counter Badge

on:
  release:
    types: [published, edited]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update download counter SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/update-badge.js

      - name: Commit updated SVG if changed
        run: |
          if [ -n "$(git status --porcelain assets/status-pills.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/status-pills.svg
            git commit -m "chore: update download count badge [skip ci]"
            git push
          fi
