name: Update Download Counter Badge

on:
  release:
    types: [published, edited]
  schedule:
    # Every 15 minutes — keep-alive: badge commit (without [skip ci]) resets the 60-day inactivity clock
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update download counter & button version SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/update-badge.js

      - name: Commit updated SVGs if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain assets/status-pills.svg assets/download-btn.svg)" ]; then
            git add assets/status-pills.svg assets/download-btn.svg
            git commit -m "chore: update download count & release badge"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "No badge changes — skipping commit."
          fi
